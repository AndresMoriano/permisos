<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permisos — UDR Valle del Guamuez</title>
<style>
  :root{--navy:#0B1E45;--navy2:#132A5E;--navy3:#1B3A73;--gold:#D4AF37;--ice:#CFE0F5;
        --green:#3FA66A;--red:#C0392B;--amber:#E0A526;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:#F1F5FB;color:#1C2B45;
       font-family:Calibri,'Segoe UI',Arial,sans-serif;}
  .head{background:var(--navy);color:#fff;padding:16px 22px;display:flex;align-items:center;
        justify-content:space-between;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);}
  .head-l{display:flex;align-items:center;gap:14px;}
  .logo-box{background:#fff;border-radius:10px;padding:6px 10px;display:flex;align-items:center;}
  .logo-box img{height:42px;width:auto;display:block;}
  .head h1{font-size:19px;margin:0;line-height:1.15;font-weight:bold;}
  .head p{margin:2px 0 0;font-size:12.5px;color:var(--ice);}
  .nav{background:var(--navy2);display:flex;gap:2px;padding:0 14px;overflow-x:auto;}
  .nav button{background:none;border:none;border-bottom:3px solid transparent;color:var(--ice);
    padding:13px 18px;font-size:14.5px;font-weight:bold;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .nav button.on{color:#fff;border-bottom-color:var(--gold);}
  .wrap{max-width:940px;margin:0 auto;padding:20px 16px 50px;}
  .card{background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 2px 14px rgba(16,38,73,.08);margin-bottom:16px;}
  h2{font-size:19px;margin:0 0 4px;color:var(--navy);}
  .sub{color:#67789B;font-size:14px;margin:0 0 16px;}
  label{display:block;font-size:12px;font-weight:bold;color:#67789B;text-transform:uppercase;
        letter-spacing:.4px;margin-bottom:5px;}
  input,select,textarea{width:100%;padding:12px 14px;border:2px solid #DCE4F0;border-radius:10px;
        font-size:15px;font-family:inherit;background:#fff;color:#1C2B45;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .fld{margin-bottom:14px;}
  .btn{background:var(--navy);color:#fff;border:none;padding:13px 26px;border-radius:26px;
       font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit;}
  .btn:hover{background:var(--navy3);}
  .btn.gold{background:var(--gold);color:var(--navy);}
  .btn.ghost{background:#fff;border:2px solid #DCE4F0;color:var(--navy);}
  .btn.ghost:hover{border-color:var(--navy);background:#fff;}
  .btn.sm{padding:7px 15px;font-size:13px;border-radius:20px;}
  .btn:disabled{opacity:.45;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .msg{border-radius:10px;padding:12px 15px;font-size:14px;margin:12px 0;}
  .msg.ok{background:#E6F6ED;color:#1F6B41;border:1px solid #9FD9B8;}
  .msg.err{background:#FDEAE8;color:#8E2A20;border:1px solid #F0AFA7;}
  .msg.info{background:#EAF1FC;color:#22457E;border:1px solid #B9CDEC;}
  .who{background:#EAF1FC;border-radius:12px;padding:12px 15px;margin-bottom:14px;font-size:14.5px;}
  .who b{color:var(--navy);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{background:#F4F7FC;color:#67789B;text-transform:uppercase;font-size:11.5px;letter-spacing:.4px;
     text-align:left;padding:10px 9px;border-bottom:2px solid #E3EAF5;}
  td{padding:10px 9px;border-bottom:1px solid #EDF1F8;vertical-align:top;}
  tr:hover td{background:#FAFCFF;}
  .pill{display:inline-block;padding:3px 11px;border-radius:14px;font-size:11.5px;font-weight:bold;}
  .p-sol{background:#FDF3D9;color:#8A6414;}
  .p-apr{background:#E6F6ED;color:#1F6B41;}
  .p-neg{background:#FDEAE8;color:#8E2A20;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 2px 10px rgba(16,38,73,.07);}
  .stat b{display:block;font-size:26px;color:var(--navy);line-height:1.1;}
  .stat span{font-size:12.5px;color:#67789B;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13.5px;}
  .bar-row .nm{width:180px;flex-shrink:0;}
  .bar-out{flex:1;background:#EDF1F8;border-radius:6px;height:16px;overflow:hidden;}
  .bar-in{background:var(--gold);height:100%;}
  .bar-row .vl{width:76px;text-align:right;font-weight:bold;color:var(--navy);}
  .empty{text-align:center;color:#93A2BE;padding:26px 10px;font-style:italic;}
  .hint{font-size:12.5px;color:#93A2BE;margin-top:6px;}
  .sect-t{font-size:12px;font-weight:bold;color:#67789B;text-transform:uppercase;letter-spacing:.5px;
          margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid #EDF1F8;}
  .foot{text-align:center;font-size:11.5px;color:#93A2BE;padding:10px 0 26px;}
  /* ---------- Optimización para celular ---------- */
  @media(max-width:640px){
    .row,.row3{grid-template-columns:1fr;}
    .head{padding:12px 14px;}
    .head h1{font-size:15.5px;} .head p{font-size:11.5px;}
    .logo-box img{height:34px;}
    .nav button{padding:12px 14px;font-size:13.5px;}
    .wrap{padding:14px 10px 40px;}
    .card{padding:18px 16px;border-radius:14px;}
    /* 16px evita que iOS haga zoom al enfocar un campo */
    input,select,textarea{font-size:16px;padding:14px;}
    .btn{width:100%;padding:15px 20px;font-size:16px;}
    .btn.sm{width:auto;padding:9px 14px;font-size:13px;}
    .btn-row{flex-direction:column;align-items:stretch;}
    .btn-row .btn.sm{width:auto;}
    .stat-grid{grid-template-columns:1fr 1fr;gap:10px;}
    .stat b{font-size:22px;}
    .bar-row .nm{width:96px;font-size:12.5px;}
    .bar-row .vl{width:52px;font-size:12.5px;}
    /* Tablas -> tarjetas apiladas */
    table,thead,tbody,tr,td{display:block;width:100%;}
    thead{display:none;}
    tr{background:#fff;border:1px solid #E7EDF7;border-radius:12px;margin-bottom:10px;padding:10px 12px;}
    tr:hover td{background:transparent;}
    td{border:none;padding:5px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
    td:before{content:attr(data-l);font-weight:bold;color:#93A2BE;font-size:11px;
      text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;}
    td:last-child{justify-content:flex-end;flex-wrap:wrap;gap:8px;padding-top:10px;}
    td:last-child:before{content:"";}
  }
</style>
</head>

  const e = await unzip(await file.arrayBuffer(), n=>n==="xl/sharedStrings.xml"||/^xl\/worksheets\/sheet\d+\.xml$/.test(n));
  let sh=[];
  if(e["xl/sharedStrings.xml"]){
    const x=new DOMParser().parseFromString(e["xl/sharedStrings.xml"],"application/xml");
    sh=Array.from(x.getElementsByTagName("si")).map(si=>Array.from(si.getElementsByTagName("t")).map(t=>t.textContent).join(""));
  }
  const names=Object.keys(e).filter(n=>n.startsWith("xl/worksheets/")).sort();
  if(!names.length) throw new Error("Sin hojas legibles");
  const x=new DOMParser().parseFromString(e[names[0]],"application/xml");
  const rows=[];
  for(const r of Array.from(x.getElementsByTagName("row"))){
    const row=[];
    for(const c of Array.from(r.getElementsByTagName("c"))){
      const ref=c.getAttribute("r")||""; const i=ref?colIdx(ref):row.length; const t=c.getAttribute("t");
      let v="";
      if(t==="inlineStr") v=Array.from(c.getElementsByTagName("t")).map(z=>z.textContent).join("");
      else{ const vv=c.getElementsByTagName("v")[0]; if(vv){ v=vv.textContent; if(t==="s") v=sh[parseInt(v,10)]??""; } }
      row[i]=v;
    }
    rows.push(row);
  }
  return rows;
}
function leerCsv(txt){
  const L=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="");
  if(!L.length) return [];
  const d=(L[0].match(/;/g)||[]).length>(L[0].match(/,/g)||[]).length?";":",";
  return L.map(line=>{ const o=[]; let cur="",q=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"') q=true; else if(ch===d){o.push(cur);cur="";} else cur+=ch; } }
    o.push(cur); return o; });
}
async function leerTabla(file){
  const grid = file.name.toLowerCase().endsWith(".csv") ? leerCsv(await file.text()) : await leerXlsx(file);
  let hi = grid.findIndex(r=>(r||[]).filter(v=>String(v??"").trim()!=="").length>=2);
  if(hi<0) return [];
  const H=(grid[hi]||[]).map(h=>String(h??"").trim()); const out=[];
  for(let i=hi+1;i<grid.length;i++){
    const r=grid[i]||[]; if(r.every(v=>String(v??"").trim()==="")) continue;
    const o={}; H.forEach((h,j)=>{ if(h) o[h]=r[j]??""; }); out.push(o);
  }
  return out;
}

function calcMin(){

function buscarFunc(){

function enviar(){
  const ced=(document.getElementById("ced").value||"").replace(/\D/g,"");
  const msg=document.getElementById("msgS");
  if(ced.length<6){ msg.innerHTML=`<div class="msg err">Escribe un número de identificación válido.</div>`; return; }
  const f=FUNC.find(x=>x.cedula===ced);
  const nom = f? f.nombres : (document.getElementById("nom")?.value||"").trim();
  if(!nom){ msg.innerHTML=`<div class="msg err">Escribe tu nombre completo.</div>`; return; }
  const tipo=document.getElementById("tipo").value;
  const causa=document.getElementById("causa").value;
  const obs=(document.getElementById("obs").value||"").trim();
  const f1=document.getElementById("f1")?.value||hoy();
  let f2=f1, h1="", h2="", mins=0, dias=1;

  if(tipo==="minutos"||tipo==="horas"){
    h1=document.getElementById("h1")?.value||""; h2=document.getElementById("h2")?.value||"";
    if(!h1||!h2){ msg.innerHTML=`<div class="msg err">Indica la hora de inicio y de fin.</div>`; return; }

    if(mins<=0){ msg.innerHTML=`<div class="msg err">La hora final debe ser posterior a la inicial.</div>`; return; }
  } else if(tipo==="rango"){
    f2=document.getElementById("f2")?.value||f1;
    if(new Date(f2)<new Date(f1)){ msg.innerHTML=`<div class="msg err">La fecha final debe ser posterior.</div>`; return; }
    dias=diasEntre(f1,f2); mins=dias*8*60;
  } else { mins=8*60; }

  const reg={ id:"p"+Date.now().toString(36)+Math.floor(Math.random()*1000),
    cedula:ced, nombres:nom, unidad:f?.unidad||"", contrat:f?.contrat||"",
    clase:(document.getElementById("clase")?.value||"Permiso"),
    tipo, fecha:f1, fecha_fin:f2, hora_ini:h1, hora_fin:h2, minutos:mins, dias,
    causa, observacion:obs, estado:"Solicitado", creado:nowISO(), resuelto:"" };
  PERM.push(reg);
  if(!save(K_PERM,PERM)){ msg.innerHTML=`<div class="msg err">No se pudo guardar. Revisa el espacio del navegador.</div>`; return; }
  const enviado = enviarSheets(reg);
  msg.innerHTML=`<div class="msg ok">✅ <b>Solicitud enviada</b><br>
    ${esc(nom)} · ${esc(causa)} · ${tipo==="rango"? dias+" día(s)" : fmtMin(mins)}<br>
    ${enviado ? "Le llegó al director. Consulta el estado en <b>Mis permisos</b>."
              : "Guardada en este dispositivo. Consulta el estado en <b>Mis permisos</b>."}</div>`;
  ["ced","obs"].forEach(id=>{const e=document.getElementById(id); if(e) e.value="";});
  document.getElementById("whoBox").innerHTML=""; document.getElementById("nomWrap").style.display="none";
  cambioTipo();
}

/* ---------- exportaciones ---------- */
function bajar(nombre, contenido, tipo){
  const blob=new Blob(["\uFEFF"+contenido],{type:tipo+";charset=utf-8;"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function csvLinea(arr){ return arr.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")+"\n"; }
function exportar(){
  // columnas que reconoce el aplicativo de asistencia
  let s=csvLinea(["Cédula","Nombres","Fecha","Causa","Estado","Observación","Clase"]);
  PERM.forEach(p=>{
    if(p.tipo==="rango"){
      let d=new Date(p.fecha+"T00:00"), fin=new Date(p.fecha_fin+"T00:00");
      while(d<=fin){
        const f=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        s+=csvLinea([p.cedula,p.nombres,f,p.causa,p.estado,p.observacion,p.clase||"Permiso"]);
        d.setDate(d.getDate()+1);
      }
    } else s+=csvLinea([p.cedula,p.nombres,p.fecha,p.causa,p.estado,p.observacion,p.clase||"Permiso"]);
  });
  bajar("Permisos_para_aplicativo_asistencia.csv", s, "text/csv");
}
function exportarCompleto(){
  let s=csvLinea(["Cédula","Nombres","Unidad","Contratación","Clase","Tipo","Fecha","Fecha fin",
                  "Hora inicio","Hora fin","Minutos","Días","Causa","Estado","Observación","Solicitado el","Resuelto el"]);
  PERM.forEach(p=>s+=csvLinea([p.cedula,p.nombres,p.unidad,p.contrat,p.clase||"Permiso",labelTipo(p),p.fecha,p.fecha_fin,
    p.hora_ini,p.hora_fin,p.minutos,p.dias,p.causa,p.estado,p.observacion,
    (p.creado||"").slice(0,19).replace("T"," "),(p.resuelto||"").slice(0,19).replace("T"," ")]));
  bajar("Reporte_completo_permisos.csv", s, "text/csv");
}
function respaldo(){ bajar("respaldo_permisos.json", JSON.stringify({permisos:PERM,funcionarios:FUNC},null,2), "application/json"); }
function restaurar(ev){
  const f=ev.target.files?.[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(Array.isArray(d.permisos)) PERM=d.permisos;
      if(Array.isArray(d.funcionarios)) FUNC=d.funcionarios;
      save(K_PERM,PERM); save(K_FUNC,FUNC); render();
      setTimeout(()=>{const m=document.getElementById("msgR"); if(m) m.innerHTML=`<div class="msg ok">Respaldo restaurado.</div>`;},0);
    }catch(e){ const m=document.getElementById("msgR"); if(m) m.innerHTML=`<div class="msg err">Archivo inválido.</div>`; } };
  r.readAsText(f); ev.target.value="";
}

/* ---------- base de funcionarios ---------- */
const AL={ ced:["cedula","cédula","documento","cc","identificacion","identificación","numero de identificacion","id","no documento"],
  nom:["nombres","nombre","nombre completo","docente","funcionario"],
  uni:["escuela / unidad","escuela/unidad","ecuela / unidad - rol","escuela / unidad - rol","unidad","escuela","area","área"],
  con:["contratacion","contratación","tipo de contratacion","tipo","tc / mt / hc","tc/mt/hc"] };
const findK=(ks,al)=>ks.find(k=>al.includes(norm(k)))||null;
async function cargarFunc(ev){
  const f=ev.target.files?.[0]; if(!f) return;
  const m=document.getElementById("msgF");
  m.innerHTML=`<div class="msg info">Leyendo archivo…</div>`;
  try{
    const filas=await leerTabla(f); let add=0, upd=0, skip=0;
    for(const row of filas){
      const ks=Object.keys(row);
      const kc=findK(ks,AL.ced), kn=findK(ks,AL.nom), ku=findK(ks,AL.uni), kt=findK(ks,AL.con);
      const ced=kc?String(row[kc]).replace(/\D/g,"").trim():"";
      const nom=kn?String(row[kn]).trim().replace(/\s+/g," "):"";
      if(!ced||!nom){ skip++; continue; }
      const uni=ku?String(row[ku]).trim():""; let con=kt?String(row[kt]).trim():"";
      const cn=norm(con);
      if(cn==="tc") con="Tiempo completo"; else if(cn==="mt") con="Medio tiempo"; else if(cn==="hc") con="Hora cátedra";
      const i=FUNC.findIndex(x=>x.cedula===ced);
      if(i>=0){ FUNC[i]={cedula:ced,nombres:nom,unidad:uni,contrat:con}; upd++; }
      else { FUNC.push({cedula:ced,nombres:nom,unidad:uni,contrat:con}); add++; }
    }
    save(K_FUNC,FUNC); render();
    setTimeout(()=>{const mm=document.getElementById("msgF"); if(mm)
      mm.innerHTML=`<div class="msg ok">Listo: ${add} nuevos, ${upd} actualizados${skip?`, ${skip} omitidos`:""}.</div>`;},0);
  }catch(e){ m.innerHTML=`<div class="msg err">No se pudo leer: ${esc(e.message||"archivo inválido")}</div>`; }
  ev.target.value="";
}

/* ---------- Google Sheets ---------- */
function guardarSheets(){
  const u=(document.getElementById("sheetsUrl").value||"").trim();
  save(K_SHEETS,u);
  document.getElementById("msgSh").innerHTML=`<div class="msg ok">${u?"Conexión guardada. Las solicitudes se enviarán a la Hoja 2 (Permisos).":"Conexión eliminada."}</div>`;
}
function payloadPermiso(reg){
  return {
    tipoRegistro:"permiso",
    cedula:reg.cedula, nombres:reg.nombres, unidad:reg.unidad, contratacion:reg.contrat,
    tipo:(reg.clase||"Permiso")+" · "+labelTipo(reg), fecha:reg.fecha, fecha_fin:reg.fecha_fin,
    hora_ini:reg.hora_ini, hora_fin:reg.hora_fin,
    minutos:reg.minutos, dias:reg.dias, causa:reg.causa,
    estado:reg.estado, observacion:reg.observacion, solicitado:reg.creado
  };
}
/* Envío por GET con parámetros en la URL.
   Apps Script responde con un redireccionamiento a googleusercontent.com;
   un POST por sendBeacon se pierde en esa redirección en varios navegadores
   de celular. Un GET sí la sigue, por eso este método es el confiable. */
function urlEnvio(reg){
  const p = payloadPermiso(reg);
  const q = Object.keys(p).map(k=>encodeURIComponent(k)+"="+encodeURIComponent(p[k]??"")).join("&");
  return urlSheets() + (urlSheets().includes("?") ? "&" : "?") + q;
}
function enviarSheets(reg){
  const base=urlSheets(); if(!base) return false;
  const url=urlEnvio(reg);
  let ok=false;
  // 1) Imagen invisible: es el método que mejor sigue redirecciones en móviles
  try{ const img=new Image(); img.referrerPolicy="no-referrer"; img.src=url; ok=true; }catch(e){}
  // 2) Respaldo: petición en segundo plano
  try{ fetch(url,{method:"GET",mode:"no-cors",keepalive:true,cache:"no-store"}).catch(()=>{}); ok=true; }catch(e){}
  return ok;
}
/* Verificación real: intenta leer la respuesta del script. */
async function verificarSheets(){
  const u=urlSheets();
  if(!u) return {ok:false, msg:"No hay dirección configurada."};
  try{
    const r = await fetch(u, {method:"GET", cache:"no-store"});
    const t = await r.text();
    try{
      const j = JSON.parse(t);
      return {ok:true, msg:"Respuesta del script recibida.", data:j};
    }catch(e){
      return {ok:false, msg:"El script respondió, pero no en el formato esperado. ¿Actualizaste el código y publicaste una versión nueva?", raw:t.slice(0,300)};
    }
  }catch(e){
    return {ok:false, msg:"No se pudo contactar el script desde el navegador (puede ser normal por seguridad). Usa la prueba de envío.", err:String(e)};
  }
}
function generarEnlace(){
  const u=(document.getElementById("sheetsUrl").value||"").trim();
  const box=document.getElementById("msgLink");
  if(!/^https:\/\/script\.google\.com\//.test(u)){
    box.innerHTML=`<div class="msg err">Primero guarda arriba una dirección válida de Apps Script (debe empezar por https://script.google.com/ y terminar en /exec).</div>`;
    return;
  }
  save(K_SHEETS,u);
  // base64 apto para URL
  const b64=btoa(unescape(encodeURIComponent(u))).replace(/\+/g,"-").replace(/\//g,"_");
  const link=location.origin+location.pathname+"?s="+b64;
  box.innerHTML=`<div class="msg ok">
      <b>Enlace listo.</b> Compártelo con los docentes por WhatsApp:
      <div style="margin:10px 0;padding:10px 12px;background:#fff;border:1px solid #B9CDEC;border-radius:8px;
                  font-size:12.5px;word-break:break-all;" id="linkTxt">${esc(link)}</div>
      <button class="btn sm" onclick="copiarEnlace()">Copiar enlace</button>
    </div>`;
  window.__link=link;
}
function copiarEnlace(){
  const t=window.__link||"";
  const done=()=>{ const b=document.getElementById("msgLink");
    if(b) b.insertAdjacentHTML("beforeend",`<div class="hint" style="color:#1F6B41;">✔ Enlace copiado.</div>`); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>{}); }
  else { const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
         try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta); done(); }
}
async function probarSheets(){
  const box=document.getElementById("msgSh");
  const u=urlSheets();
  if(!u){ box.innerHTML=`<div class="msg err">No hay dirección configurada.</div>`; return; }
  box.innerHTML=`<div class="msg info">Verificando…</div>`;

  const v = await verificarSheets();
  let html = `<div class="msg ${v.ok?'ok':'info'}">
      <b>Dirección en uso:</b><br>
      <span style="font-size:12px;word-break:break-all;">${esc(u)}</span><br><br>`;
  if(v.ok && v.data){
    const hojas=(v.data.hojas||[]).map(h=>`${esc(h.nombre)} (${h.filas} filas)`).join(" · ");
    html += `✔ <b>El script respondió correctamente.</b><br>${hojas?"Hojas: "+hojas:""}`;
  } else {
    html += `${esc(v.msg)}`;
    if(v.raw) html += `<br><span style="font-size:11.5px;color:#67789B;">Respuesta: ${esc(v.raw)}</span>`;
  }
  html += `</div>`;
  box.innerHTML = html;

  // envío de prueba real
  enviarSheets({cedula:"PRUEBA",nombres:"Registro de prueba",unidad:"—",contrat:"—",clase:"Permiso",
    tipo:"minutos",fecha:hoy(),fecha_fin:hoy(),hora_ini:"08:00",hora_fin:"08:15",minutos:15,dias:1,
    causa:"Prueba de conexión",estado:"Solicitado",observacion:"Envío de prueba",creado:nowISO()});
  box.insertAdjacentHTML("beforeend",
    `<div class="msg ok">Se envió además un registro de prueba. Revisa la hoja <b>Permisos</b> en unos segundos.</div>`);
}
